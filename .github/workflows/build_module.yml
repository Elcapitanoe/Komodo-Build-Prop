name: Build Module

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Target Device Codename(s) (space-separated)'
        required: true
        type: string
        default: 'komodo komodo_beta17q2'
      commit_submodule:
        description: 'Commit updated submodule pointer back to main repo?'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 12 15 * *'

jobs:
  sync-submodule:
    name: Sync Submodule Pointer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit_step.outputs.commit_sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update Submodule to Latest Remote Commit
        run: |
          git submodule update --init --remote --recursive
          cd source-code
          git fetch origin
          git checkout origin/main
          cd ..

      - name: Commit & Push Submodule Pointer
        id: commit_step
        if: github.event_name == 'schedule' || github.event.inputs.commit_submodule == 'true' || github.event.inputs.commit_submodule == true
        run: |
          git add source-code
          if ! git diff --cached --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync source-code submodule pointer [skip ci]"
            git push origin main
            echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set_devices.outputs.devices }}
    steps:
      - name: Determine Device Matrix
        id: set_devices
        run: |
          INPUT="${{ github.event.inputs.devices || 'komodo komodo_beta17q2' }}"
          JSON=$(echo "$INPUT" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s -c .)
          echo "devices=$JSON" >> "$GITHUB_OUTPUT"

  build:
    name: Build Device
    needs: [sync-submodule, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.prepare.outputs.devices) }}
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-submodule.outputs.commit_sha || 'main' }}
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full e2fsprogs erofs-utils lz4 cpio \
            dos2unix aria2 curl xxd python3 python3-pip jq

      - name: Install Python Dependencies
        run: |
          pip3 install payload_dumper
          which payload_dumper || echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Make Scripts Executable
        working-directory: source-code
        run: |
          chmod +x *.sh module_files/*.sh 2>/dev/null || chmod +x *.sh

      - name: Download OTA
        working-directory: source-code
        run: |
          bash download_latest_ota_build.sh ${{ matrix.device }}

      - name: Extract and Build
        working-directory: source-code
        run: |
          bash extract_images.sh

      - name: Check Duplicates & Prepare Artifact
        id: check
        working-directory: source-code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DEVICE: ${{ matrix.device }}
        run: |
          zip=$(find . -maxdepth 1 -name "*.zip" -type f -print -quit 2>/dev/null)
          if [ -z "$zip" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          name=$(basename "$zip")
          EXISTING=$(mktemp)
          trap 'rm -f "$EXISTING"' EXIT

          gh release list -R "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | \
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              gh release view "$tag" -R "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null >> "$EXISTING" || true
            done

          if grep -qxF "$name" "$EXISTING" 2>/dev/null; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            rm -f "$zip"
            exit 0
          fi

          codename=$(echo "$name" | cut -d_ -f1 | tr '[:upper:]' '[:lower:]')
          prop=$(find extracted_images -maxdepth 2 -name "module.prop" -path "*/${codename}*-ota-*" 2>/dev/null | head -1)
          prop_dir=$(dirname "$prop")
          desc=""
          device_name=""
          if [ -f "$prop" ]; then
            desc=$(grep '^description=' "$prop" | cut -d= -f2- | head -1)
            device_name=$(grep -m1 '^ro.product.model=' "$prop_dir/system.prop" 2>/dev/null | cut -d= -f2- | head -1)
          fi
          [ -z "$device_name" ] && device_name="${codename^}"

          zip_hash=$(sha256sum "$zip" | awk '{print $1}')

          mkdir -p upload
          mv "$zip" upload/

          jq -n \
            --arg codename "$codename" \
            --arg zip_name "$name" \
            --arg sha256 "$zip_hash" \
            --arg device_name "$device_name" \
            --arg description "$desc" \
            '{codename: $codename, zip_name: $zip_name, sha256: $sha256, device_name: $device_name, description: $description}' \
            > "upload/metadata-${TARGET_DEVICE}.json"

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      - name: Upload Runner Artifact
        if: steps.check.outputs.has_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.device }}
          path: source-code/upload/*
          retention-days: 1

  release:
    name: Release & Notify
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: module-*
          merge-multiple: true
          path: new_modules/
        continue-on-error: true

      - name: Aggregate & Publish to GitHub Release
        id: aggregate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p new_modules
          COUNT=$(find new_modules -maxdepth 1 -name "*.zip" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$(date '+%Y%m%d')"
          TITLE="$(date '+%Y-%m-%d')"
          REPO="${{ github.repository }}"

          BODY=""
          for meta in new_modules/metadata-*.json; do
            [ -f "$meta" ] || continue
            d_name=$(jq -r '.device_name' "$meta")
            z_name=$(jq -r '.zip_name' "$meta")
            s256=$(jq -r '.sha256' "$meta")
            desc=$(jq -r '.description' "$meta")

            BODY+=$(printf "## %s\n- File: \`%s\`\n- SHA256: \`%s\`\n- Description: %s\n\n" "$d_name" "$z_name" "$s256" "$desc")
          done

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" new_modules/*.zip -R "$REPO" --clobber
            EXISTING_BODY=$(gh release view "$TAG" -R "$REPO" --json body -q .body 2>/dev/null || echo "")
            gh release edit "$TAG" -R "$REPO" --notes "${EXISTING_BODY}"$'\n\n'"${BODY}"
          else
            gh release create "$TAG" new_modules/*.zip -R "$REPO" --title "$TITLE" --notes "$BODY"
          fi

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      - name: Send Built Modules to Telegram
        if: steps.aggregate.outputs.has_new == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi

          for meta in new_modules/metadata-*.json; do
            [ -f "$meta" ] || continue
            d_name=$(jq -r '.device_name' "$meta")
            z_name=$(jq -r '.zip_name' "$meta")
            s256=$(jq -r '.sha256' "$meta")
            desc=$(jq -r '.description' "$meta")
            zip_file="new_modules/$z_name"

            CAPTION=$(echo -e "*New Magisk Module Built!*\n\nDevice: $d_name\nFile: \`$z_name\`\nSHA256: \`$s256\`\nDescription: $desc")

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F document=@"$zip_file" \
              -F parse_mode="Markdown" \
              -F caption="$CAPTION"
          done
