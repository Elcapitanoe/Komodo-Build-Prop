name: Build Komodo Pixel Props (Upstream)

on:
  workflow_dispatch:
  schedule:
    # Poll upstream; build only unseen IDs.
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      build_id: ${{ steps.check.outputs.build_id }}
      target_version: ${{ steps.check.outputs.target_version }}
    steps:
      - name: Check latest upstream beta state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_STATE_URL: https://raw.githubusercontent.com/Elcapitanoe/Build-Prop-BETA/main/data/state.json
        shell: bash
        run: |
          set -euo pipefail

          state_file=$(mktemp)
          trap 'rm -f "$state_file"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 15 --max-time 30 \
            "$UPSTREAM_STATE_URL" > "$state_file"

          build_id=$(jq -er '.fingerprint.build_id // empty' "$state_file")
          active_url=$(jq -er '.active_target.url // empty' "$state_file")
          target_version=$(jq -er '
            .active_target as $target |
            if ($target.qpr // null) == null
            then "Android \($target.major)"
            else "Android \($target.major) QPR\($target.qpr)"
            end
          ' "$state_file")

          case "$active_url" in
            https://developer.android.com/about/versions/*/download-ota)
              ;;
            *)
              echo "::error::Upstream active target is not a supported Beta URL: $active_url"
              exit 1
              ;;
          esac

          existing_assets=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].assets[].name' 2>/dev/null || true)

          if printf '%s\n' "$existing_assets" | grep -Fq -- "$build_id"; then
            echo "Build $build_id is already released; skipping upstream build."
            should_build=false
          else
            echo "New upstream build detected: $build_id ($target_version)."
            should_build=true
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "target_version=$target_version" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    permissions:
      contents: write
    uses: Elcapitanoe/Build-Prop-BETA/.github/workflows/build.yml@main
    with:
      # Upstream resolves the current Beta version for komodo.
      devices: komodo
      prerelease: false
    secrets: inherit
