name: Build Module

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Target Device Codename(s) (space-separated)'
        required: true
        type: string
        default: 'komodo komodo_beta17q2'
      prerelease:
        description: 'Publish as Pre-Release (alpha tag)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 12 15 * *'

jobs:
  build-and-release:
    name: Build & Release
    permissions:
      contents: write
    uses: Elcapitanoe/Build-Prop-BETA/.github/workflows/build.yml@main
    with:
      devices: ${{ inputs.devices || 'komodo komodo_beta17q2' }}
      prerelease: ${{ inputs.prerelease || false }}
    secrets: inherit
