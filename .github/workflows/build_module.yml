name: Build Module

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Target Device Codename'
        required: true
        type: string
        default: 'komodo_beta17q2'
      commit_submodule:
        description: 'Commit updated submodule pointer back to main repo?'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 12 15 * *'

jobs:
  sync-submodule:
    name: Sync & Update Submodule Pointer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit_step.outputs.commit_sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update Submodule to Latest Remote Commit
        run: |
          git submodule update --init --remote --recursive
          cd source-code
          git fetch origin
          git checkout origin/main
          cd ..

      - name: Commit & Push Submodule Pointer
        id: commit_step
        if: github.event_name == 'schedule' || github.event.inputs.commit_submodule == 'true' || github.event.inputs.commit_submodule == true
        run: |
          git add source-code
          if ! git diff --cached --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync source-code submodule pointer [skip ci]"
            git push origin main
            echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build & Release Module
    needs: sync-submodule
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-submodule.outputs.commit_sha || 'main' }}
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full e2fsprogs erofs-utils lz4 cpio \
            dos2unix aria2 curl xxd python3 python3-pip jq

      - name: Install Python Dependencies
        run: |
          pip3 install payload_dumper
          which payload_dumper || echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Make Scripts Executable
        working-directory: source-code
        run: |
          chmod +x *.sh module_files/*.sh 2>/dev/null || chmod +x *.sh

      - name: Download OTA for ${{ github.event.inputs.device_name || 'komodo_beta17q2' }}
        working-directory: source-code
        run: |
          bash download_latest_ota_build.sh ${{ github.event.inputs.device_name || 'komodo_beta17q2' }}

      - name: Extract and Build
        working-directory: source-code
        run: |
          bash extract_images.sh

      - name: Check for Duplicates & Prepare Release Asset
        id: check
        working-directory: source-code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(find . -maxdepth 1 -name "*.zip" -type f -print -quit 2>/dev/null)
          if [ -z "$zip" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          name=$(basename "$zip")
          EXISTING=$(mktemp)
          trap 'rm -f "$EXISTING"' EXIT

          gh release list -R "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | \
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              gh release view "$tag" -R "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null >> "$EXISTING" || true
            done

          if grep -qxF "$name" "$EXISTING" 2>/dev/null; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            rm -f "$zip"
            exit 0
          fi

          codename=$(echo "$name" | cut -d_ -f1 | tr '[:upper:]' '[:lower:]')
          prop=$(find extracted_images -maxdepth 2 -name "module.prop" -path "*/${codename}-ota-*" 2>/dev/null | head -1)
          prop_dir=$(dirname "$prop")
          desc=""
          device_name=""
          if [ -f "$prop" ]; then
            desc=$(grep '^description=' "$prop" | cut -d= -f2- | head -1)
            device_name=$(grep -m1 '^ro.product.model=' "$prop_dir/system.prop" 2>/dev/null | cut -d= -f2- | head -1)
          fi
          [ -z "$device_name" ] && device_name="${codename^}"

          zip_hash=$(sha256sum "$zip" | awk '{print $1}')

          mkdir -p upload
          mv "$zip" upload/

          echo "has_new=true" >> "$GITHUB_OUTPUT"
          echo "zip_path=source-code/upload/$name" >> "$GITHUB_OUTPUT"
          echo "zip_name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$zip_hash" >> "$GITHUB_OUTPUT"
          echo "device_name=$device_name" >> "$GITHUB_OUTPUT"
          echo "description=$desc" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        if: steps.check.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(date '+%Y%m%d')"
          TITLE="$(date '+%Y-%m-%d')"
          REPO="${{ github.repository }}"

          BODY=$(printf "## %s\n- File: \`%s\`\n- SHA256: \`%s\`\n- Description: %s\n" \
            "${{ steps.check.outputs.device_name }}" \
            "${{ steps.check.outputs.zip_name }}" \
            "${{ steps.check.outputs.sha256 }}" \
            "${{ steps.check.outputs.description }}")

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.check.outputs.zip_path }}" -R "$REPO" --clobber
            EXISTING_BODY=$(gh release view "$TAG" -R "$REPO" --json body -q .body 2>/dev/null || echo "")
            gh release edit "$TAG" -R "$REPO" --notes "${EXISTING_BODY}"$'\n\n'"${BODY}"
          else
            gh release create "$TAG" "${{ steps.check.outputs.zip_path }}" -R "$REPO" --title "$TITLE" --notes "$BODY"
          fi

      - name: Send Built Module to Telegram
        if: steps.check.outputs.has_new == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi

          CAPTION=$(echo -e "*New Magisk Module Built!*\n\nDevice: ${{ steps.check.outputs.device_name }}\nFile: \`${{ steps.check.outputs.zip_name }}\`\nSHA256: \`${{ steps.check.outputs.sha256 }}\`\nDescription: ${{ steps.check.outputs.description }}")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"${{ steps.check.outputs.zip_path }}" \
            -F parse_mode="Markdown" \
            -F caption="$CAPTION"
