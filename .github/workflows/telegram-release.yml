name: Release to Telegram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific release tag to broadcast (leave empty for latest)'
        required: false
        type: string
        default: ''

jobs:
  broadcast-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package
        run: pip install .

      - name: Broadcast release to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag || github.event.release.tag_name || '' }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            komodo-tools release telegram --tag "$INPUT_TAG"
          else
            komodo-tools release telegram
          fi
