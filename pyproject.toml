[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "komodo-tools"
version = "0.2.0"
description = "CLI utilities and automation pipeline for Komodo Pixel Props"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Elcapitanoe" }
]
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
komodo-tools = "komodo_tools.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
